apiVersion: apps/v1
kind: Deployment

metadata:
  name: frontend-service

spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend-service
  
  template:
    metadata:
      labels:
        app: frontend-service
    
    spec:
      containers:
        - name: frontend-service
          image: frontend-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: frontend-service-config
          
          resources:
            requests:
              memory: "128Mi"
              cpu: "250m"